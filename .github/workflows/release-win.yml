name: release-win

# Gera o instalador Windows e publica no GitHub Release.
# Como usar: git tag v0.1.0 && git push origin v0.1.0
# O .exe publicado alimenta o download direto, o winget e o auto-update.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run build
      # electron-builder cria a release via GitHub API em paralelo por artefato
      # (nsis, blockmap, latest.yml); sem uma release já existente, duas tasks
      # de upload disputam o "get-or-create" e cada uma cria a sua -> releases
      # duplicadas na mesma tag. Criar antes, idempotente, garante que o
      # publish sempre encontre uma única release já existente.
      - name: garantir release única antes do publish
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "" || echo "release já existe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
